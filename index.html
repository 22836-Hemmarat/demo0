<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>โปรไฟล์นักเรียน - ด.ช.เหมรัศมิ์ เนตรศิลป์</title>
    <style>
        /* Import Google Fonts */
        @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=Sarabun:wght@400;500;700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Sarabun', sans-serif;
            background-color: #eef2f7;
            color: #334155;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .profile-card {
            width: 210mm;
            min-height: 297mm;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(30, 41, 59, 0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .header {
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
            color: #ffffff;
            padding: 40px 50px;
            display: flex;
            align-items: center;
            gap: 35px;
            border-bottom: 5px solid #60a5fa;
            position: relative;
        }

        /* Avatar Container styles */
        .avatar-container {
            width: 140px;
            height: 140px;
            background: #ffffff;
            border-radius: 50%;
            padding: 5px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.15);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
            overflow: hidden; /* Important for circular image */
        }

        /* Styles for the new profile image */
        .profile-image {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Maintain aspect ratio and cover the container */
            border-radius: 50%; /* Keep it circular */
        }

        .header-info {
            flex-grow: 1;
        }

        .school-tag {
            font-family: 'Chakra Petch', sans-serif;
            background: rgba(255, 255, 255, 0.2);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            display: inline-block;
            margin-bottom: 12px;
            text-transform: uppercase;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .student-name {
            font-family: 'Chakra Petch', sans-serif;
            font-size: 32px;
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 5px;
        }

        .student-nickname {
            font-size: 20px;
            color: #bfdbfe;
            font-weight: 500;
            margin-bottom: 10px;
        }

        .grade-badge {
            display: inline-flex;
            align-items: center;
            background: #ef4444;
            color: white;
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="profile-card">
        <!-- Header Section -->
        <div class="header">
            <div class="avatar-container">
                <!-- REPLACED SVG WITH IMAGE TAG -->
                <img src="https://cdn.onefc.com/wp-content/uploads/sites/5/2024/06/OL68-Suablack-vs-Kiamran-Nabati-7-scaled.jpg" alt="ด.ช.เหมรัศมิ์ เนตรศิลป์" class="profile-image">
            </div>
            <div class="header-info">
                <span class="school-tag">โรงเรียนจอมทอง</span>
                <h1 class="student-name">ด.ช.เหมรัศมิ์ เนตรศิลป์</h1>
                <div class="student-nickname">ชื่อเล่น: <strong>เซเว่น</strong></div>
                <span class="grade-badge">ชั้นมัธยมศึกษาปีที่ 3</span>
            </div>
        </div>
    </div>
</body>
</html>
