<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ประวัติส่วนตัว - ด.ช.เหมรัศมิ์ เนตรศิลป์</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Kanit', sans-serif;
        }

        body {
            background-color: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #333;
        }

        .profile-card {
            background: #ffffff;
            width: 100%;
            max-width: 400px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            transition: transform 0.3s ease;
        }

        .profile-card:hover {
            transform: translateY(-5px);
        }

        .card-header {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            text-align: center;
            padding: 40px 20px 20px;
            position: relative;
        }

        .profile-pic {
            width: 100px;
            height: 100px;
            background-color: #ffffff;
            color: #2a5298;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 3rem;
            margin: 0 auto 15px;
            border: 4px solid #e2e8f0;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .card-header h1 {
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .card-header p {
            font-size: 1.1rem;
            font-weight: 300;
            opacity: 0.9;
        }

        .card-body {
            padding: 30px;
        }

        .info-list {
            list-style: none;
        }

        .info-list li {
            display: flex;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid #f1f5f9;
            font-size: 1.05rem;
        }

        .info-list li:last-child {
            border-bottom: none;
        }

        .icon-box {
            width: 40px;
            height: 40px;
            background-color: #ebf4ff;
            color: #2a5298;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-right: 15px;
            font-size: 1.2rem;
            transition: background 0.3s ease, color 0.3s ease;
        }

        .info-list li:hover .icon-box {
            background-color: #2a5298;
            color: #ffffff;
        }

        .label {
            font-weight: 500;
            color: #64748b;
            margin-right: 10px;
        }

        .value {
            font-weight: 400;
            color: #1e293b;
        }
    </style>
</head>
<body>

    <div class="profile-card">
        <div class="card-header">
            <div class="profile-pic">
                <i class="fa-solid fa-user-graduate"></i>
            </div>
            <h1>ด.ช.เหมรัศมิ์ เนตรศิลป์</h1>
            <p>(น้องเซเว่น)</p>
        </div>
        
        <div class="card-body">
            <ul class="info-list">
                <li>
                    <div class="icon-box"><i class="fa-solid fa-cake-candles"></i></div>
                    <span class="label">วันเกิด:</span> 
                    <span class="value">18 พฤศจิกายน 2554</span>
                </li>
                <li>
                    <div class="icon-box"><i class="fa-solid fa-utensils"></i></div>
                    <span class="label">อาหารที่ชอบ:</span> 
                    <span class="value">กะเพราหมูสับไข่ดาว</span>
                </li>
                <li>
                    <div class="icon-box"><i class="fa-solid fa-palette"></i></div>
                    <span class="label">สีที่ชอบ:</span> 
                    <span class="value">สีน้ำเงิน</span>
                </li>
                <li>
                    <div class="icon-box"><i class="fa-solid fa-book"></i></div>
                    <span class="label">วิชาที่ชอบ:</span> 
                    <span class="value">วิชาคอมพิวเตอร์ และ พละศึกษา</span>
                </li>
                <li>
                    <div class="icon-box"><i class="fa-solid fa-user-group"></i></div>
                    <span class="label">เพื่อนสนิท:</span> 
                    <span class="value">น้องจูน</span>
                </li>
            </ul>
        </div>
    </div>

</body>
</html>
